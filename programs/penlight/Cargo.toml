[package]
name = "penlight"
version = "0.1.0"
description = "Sealed lots of real tokens, sold on a falling clock inside a private rollup"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "penlight"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.2" }
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor", "access-control", "vrf"] }
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
